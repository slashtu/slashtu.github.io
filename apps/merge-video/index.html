<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Video Merger (Lossless)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- FFmpeg.wasm v0.12+ dependencies -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
        background-color: #f2f2f7; /* iOS system background color */
      }

      /* Custom scrollbar for logs and file list */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
      .log-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4b5563;
      }

      /* iOS safe area padding for modern iPhones */
      .safe-area-pt {
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>
  <body class="min-h-screen text-gray-900 antialiased flex flex-col pb-10">
    <header
      class="bg-white/70 backdrop-blur-xl sticky top-0 z-50 border-b border-gray-200 safe-area-pt"
    >
      <div
        class="px-6 py-4 flex justify-between items-center max-w-md mx-auto w-full"
      >
        <h1 class="text-xl font-bold tracking-tight">
          MergeVid <span class="text-blue-500">Pro</span>
        </h1>
        <span
          class="text-[10px] font-semibold bg-gray-100 text-gray-600 uppercase tracking-wider py-1 px-2.5 rounded-full"
          >Lossless</span
        >
      </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto px-4 mt-6 flex flex-col gap-5">
      <div
        class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-3"
      >
        <div
          class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center text-blue-500"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-7 h-7"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
        </div>
        <div class="text-center">
          <h2 class="text-[17px] font-semibold text-gray-900">Select Videos</h2>
          <p class="text-sm text-gray-500 mt-1 leading-tight">
            Videos must share the same resolution and codecs for lossless
            merging.
          </p>
        </div>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="video/*"
          class="hidden"
        />
        <button
          onclick="document.getElementById('fileInput').click()"
          class="mt-3 w-full py-3.5 px-4 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded-xl font-medium transition-colors shadow-sm text-[17px]"
        >
          Choose Files
        </button>
      </div>

      <div
        id="fileListContainer"
        class="hidden bg-white rounded-2xl p-4 shadow-sm border border-gray-100"
      >
        <div class="flex justify-between items-center mb-3 px-1">
          <h3 class="text-sm font-semibold text-gray-800">
            Queue (<span id="fileCount">0</span>)
          </h3>
          <button
            onclick="clearFiles()"
            class="text-sm text-blue-500 font-medium active:text-blue-700"
          >
            Clear
          </button>
        </div>
        <ul
          id="fileList"
          class="custom-scrollbar max-h-48 overflow-y-auto pr-1 space-y-2"
        >
          <!-- File items injected here via JS -->
        </ul>

        <button
          id="mergeBtn"
          class="mt-4 w-full py-3.5 px-4 bg-gray-900 text-white rounded-xl font-medium transition-transform active:scale-[0.98] text-[17px] shadow-sm flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
              clip-rule="evenodd"
            />
          </svg>
          Merge Instantly
        </button>
      </div>

      <div id="processingContainer" class="hidden flex-col gap-3 w-full">
        <div
          class="bg-gray-900 rounded-2xl p-4 shadow-sm overflow-hidden border border-gray-800"
        >
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-mono text-gray-400">FFmpeg Terminal</span>
            <div class="flex gap-1.5">
              <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
            </div>
          </div>
          <div
            id="logOutput"
            class="log-scrollbar h-40 overflow-y-auto font-mono text-[10px] text-green-400 leading-relaxed whitespace-pre-wrap break-words"
          >
            Loading FFmpeg core...
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div
            class="flex justify-between text-sm font-medium mb-2 text-gray-700"
          >
            <span>Progress</span>
            <span id="progressText">0%</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
            <div
              id="progressBar"
              class="bg-blue-500 h-2.5 rounded-full transition-all duration-300"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </div>

      <div
        id="resultContainer"
        class="hidden bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex-col items-center text-center gap-4"
      >
        <div
          class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center text-green-500 mb-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.5 12.75l6 6 9-13.5"
            />
          </svg>
        </div>
        <div>
          <h3 class="text-xl font-bold text-gray-900">Success!</h3>
          <p class="text-sm text-gray-500 mt-1">
            Your lossless video is ready.
          </p>
        </div>

        <video
          id="previewVideo"
          class="w-full rounded-lg mt-2 bg-black aspect-video object-contain border border-gray-200"
          controls
          playsinline
        ></video>

        <a
          id="downloadLink"
          class="w-full mt-2 py-3.5 px-4 bg-blue-500 text-white rounded-xl font-medium transition-transform active:scale-[0.98] text-[17px] shadow-sm flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
            />
          </svg>
          Save to Photos
        </a>
        <button
          onclick="resetApp()"
          class="text-[15px] text-gray-500 font-medium active:text-gray-800 mt-2 py-2"
        >
          Merge More Videos
        </button>
      </div>
    </main>

    <script>
      const fileInput = document.getElementById('fileInput');
      const fileListContainer = document.getElementById('fileListContainer');
      const fileList = document.getElementById('fileList');
      const fileCountSpan = document.getElementById('fileCount');
      const mergeBtn = document.getElementById('mergeBtn');
      const processingContainer = document.getElementById(
        'processingContainer'
      );
      const logOutput = document.getElementById('logOutput');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const resultContainer = document.getElementById('resultContainer');
      const downloadLink = document.getElementById('downloadLink');
      const previewVideo = document.getElementById('previewVideo');

      let selectedFiles = [];
      let isProcessing = false;
      let ffmpeg = null;

      // Add message to terminal UI
      function appendLog(message) {
        const span = document.createElement('div');
        span.textContent = `> ${message}`;
        logOutput.appendChild(span);
        logOutput.scrollTop = logOutput.scrollHeight;
      }

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          selectedFiles = Array.from(e.target.files);
          updateFileListUI();
          fileListContainer.classList.remove('hidden');
          resultContainer.classList.add('hidden');
        }
      });

      function updateFileListUI() {
        fileCountSpan.textContent = selectedFiles.length;
        fileList.innerHTML = '';

        selectedFiles.forEach((file, index) => {
          const li = document.createElement('li');
          li.className =
            'bg-gray-50 rounded-xl p-3 text-sm text-gray-700 flex items-center justify-between border border-gray-100';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'truncate pr-2 font-medium';
          nameSpan.textContent = file.name;

          const sizeSpan = document.createElement('span');
          sizeSpan.className =
            'text-xs text-gray-400 font-mono whitespace-nowrap';
          sizeSpan.textContent = (file.size / (1024 * 1024)).toFixed(1) + ' MB';

          li.appendChild(nameSpan);
          li.appendChild(sizeSpan);
          fileList.appendChild(li);
        });
      }

      function clearFiles() {
        if (isProcessing) return;
        selectedFiles = [];
        fileInput.value = '';
        fileListContainer.classList.add('hidden');
        processingContainer.classList.add('hidden');
        resultContainer.classList.add('hidden');
      }

      function resetApp() {
        clearFiles();
        previewVideo.src = '';
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        logOutput.innerHTML = '';
      }

      async function initFFmpeg() {
        if (ffmpeg) return true;

        try {
          const { FFmpeg } = window.FFmpegWASM;
          ffmpeg = new FFmpeg();

          ffmpeg.on('log', ({ message }) => {
            console.log(message);
            appendLog(message);
          });

          ffmpeg.on('progress', ({ progress, time }) => {
            // Progress is between 0 and 1
            const percent = Math.max(
              0,
              Math.min(100, Math.round(progress * 100))
            );
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
          });

          appendLog('Downloading FFmpeg core...');

          // Load core and wasm from unpkg
          await ffmpeg.load({
            coreURL:
              'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
            wasmURL:
              'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
          });

          appendLog('FFmpeg core loaded successfully.');
          return true;
        } catch (error) {
          console.error('FFmpeg Load Error:', error);
          appendLog(`ERROR: ${error.message}`);
          return false;
        }
      }

      mergeBtn.addEventListener('click', async () => {
        if (selectedFiles.length < 2) {
          const msg = document.createElement('div');
          msg.className = 'text-red-500 text-sm mt-2 font-medium text-center';
          msg.textContent = 'Please select at least 2 videos.';
          fileListContainer.appendChild(msg);
          setTimeout(() => msg.remove(), 3000);
          return;
        }
        if (isProcessing) return;

        isProcessing = true;
        mergeBtn.disabled = true;
        mergeBtn.classList.add('opacity-50');

        // UI Updates
        fileListContainer.classList.add('hidden');
        processingContainer.classList.remove('hidden');
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        logOutput.innerHTML = '';

        try {
          // Initialize engine
          const isReady = await initFFmpeg();
          if (!isReady) throw new Error('Failed to initialize FFmpeg.');

          const { fetchFile } = window.FFmpegUtil;
          let listFileContent = '';

          appendLog(`Preparing ${selectedFiles.length} files for merging...`);

          // 1. Write files to FFmpeg Virtual File System (VFS)
          for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            // Sanitize file names to prevent issues in the concat text file
            const ext = file.name.split('.').pop();
            const safeName = `input_${i}.${ext}`;

            appendLog(`Writing ${safeName} to VFS...`);
            const fileData = await fetchFile(file);
            await ffmpeg.writeFile(safeName, fileData);

            // Append to the list text file format
            listFileContent += `file '${safeName}'\n`;
          }

          // 2. Create the mylist.txt configuration file
          appendLog('Creating concat configuration file...');
          await ffmpeg.writeFile('mylist.txt', listFileContent);

          // 3. Execute the FFmpeg Concatenation Command
          appendLog('Starting lossless concatenation (-c copy)...');
          progressBar.style.width = '10%'; // Give a visual bump
          progressText.textContent = 'Merging...';

          await ffmpeg.exec([
            '-f',
            'concat',
            '-safe',
            '0',
            '-i',
            'mylist.txt',
            '-c',
            'copy',
            'output.mp4',
          ]);

          // 4. Retrieve the output file
          appendLog('Retrieving final output...');
          const data = await ffmpeg.readFile('output.mp4');

          const blob = new Blob([data.buffer], { type: 'video/mp4' });
          const url = URL.createObjectURL(blob);

          // Update UI for success
          processingContainer.classList.add('hidden');
          resultContainer.classList.remove('hidden');

          // Set preview and download link
          previewVideo.src = url;
          downloadLink.href = url;
          downloadLink.download = `MergedVideo_${Date.now()}.mp4`;
        } catch (error) {
          console.error('Merge Error:', error);
          appendLog(`CRITICAL ERROR: ${error.message}`);
          progressText.textContent = 'Failed';
          progressBar.classList.replace('bg-blue-500', 'bg-red-500');
        } finally {
          isProcessing = false;
          mergeBtn.disabled = false;
          mergeBtn.classList.remove('opacity-50');
        }
      });
    </script>
  </body>
</html>
