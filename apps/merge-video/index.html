<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Video Merger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
        background-color: #f3f4f6;
      }

      /* Custom scrollbar for file list */
      .file-list::-webkit-scrollbar {
        width: 4px;
      }
      .file-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .file-list::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }

      /* iOS style toggle animation */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
        }
      }
      .processing-pulse {
        animation: pulse-ring 2s infinite;
      }
    </style>
  </head>
  <body class="min-h-screen text-gray-800 antialiased flex flex-col pb-10">
    <header
      class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200 safe-area-pt"
    >
      <div
        class="px-6 py-4 flex justify-between items-center max-w-md mx-auto w-full"
      >
        <h1
          class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent"
        >
          MergeVid
        </h1>
        <span
          class="text-xs font-medium bg-blue-100 text-blue-700 py-1 px-2 rounded-full"
          >iOS Ready</span
        >
      </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto px-4 mt-6 flex flex-col gap-6">
      <!-- File Input Area -->
      <div
        class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-4"
      >
        <div
          class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 mb-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4.5v15m7.5-7.5h-15"
            />
          </svg>
        </div>
        <div class="text-center">
          <h2 class="text-lg font-semibold text-gray-900">Select Videos</h2>
          <p class="text-sm text-gray-500 mt-1">
            Choose multiple videos to combine.
          </p>
        </div>

        <input
          type="file"
          id="fileInput"
          multiple
          accept="video/*"
          class="hidden"
        />
        <button
          onclick="document.getElementById('fileInput').click()"
          class="mt-2 w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl font-medium transition-colors shadow-sm"
        >
          Browse Files
        </button>
      </div>

      <div
        id="fileListContainer"
        class="hidden bg-white rounded-2xl p-4 shadow-sm border border-gray-100"
      >
        <div class="flex justify-between items-center mb-3 px-2">
          <h3 class="text-sm font-semibold text-gray-700">
            Selected Files (<span id="fileCount">0</span>)
          </h3>
          <button
            onclick="clearFiles()"
            class="text-xs text-red-500 font-medium hover:text-red-600"
          >
            Clear All
          </button>
        </div>
        <ul
          id="fileList"
          class="file-list max-h-48 overflow-y-auto pr-2 space-y-2"
        >
          <!-- File items injected here via JS -->
        </ul>
      </div>

      <div
        id="previewContainer"
        class="hidden flex-col items-center gap-4 w-full"
      >
        <div
          class="w-full bg-black rounded-2xl overflow-hidden shadow-lg aspect-[9/16] relative border border-gray-200"
        >
          <!-- The canvas acts as the preview and the source for recording -->
          <canvas
            id="renderCanvas"
            class="w-full h-full object-contain"
          ></canvas>

          <!-- Status Overlay -->
          <div
            id="statusOverlay"
            class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white backdrop-blur-sm transition-opacity duration-300"
          >
            <div
              id="loadingSpinner"
              class="processing-pulse w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"
            ></div>
            <p id="statusText" class="font-medium text-lg">Ready to Merge</p>
            <p
              id="progressText"
              class="text-sm text-gray-300 mt-1 opacity-0 transition-opacity"
            >
              0 / 0
            </p>
          </div>
        </div>

        <!-- Merge Button -->
        <button
          id="mergeBtn"
          class="w-full py-4 px-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl font-semibold text-lg shadow-md hover:shadow-lg transition-all active:scale-[0.98]"
        >
          Start Merging
        </button>
      </div>

      <div
        id="resultContainer"
        class="hidden bg-white rounded-2xl p-6 shadow-sm border border-green-100 flex-col items-center text-center gap-4"
      >
        <div
          class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center text-green-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2.5"
            stroke="currentColor"
            class="w-7 h-7"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.5 12.75l6 6 9-13.5"
            />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900">Merge Complete!</h3>
          <p class="text-sm text-gray-500 mt-1">
            Your video is ready to download.
          </p>
        </div>
        <a
          id="downloadLink"
          class="w-full py-3.5 px-4 bg-gray-900 text-white rounded-xl font-medium transition-colors shadow-sm flex items-center justify-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
            />
          </svg>
          Save Video
        </a>
        <button
          onclick="resetApp()"
          class="text-sm text-gray-500 font-medium hover:text-gray-800 mt-2"
        >
          Create Another
        </button>
      </div>
    </main>

    <script>
      const fileInput = document.getElementById('fileInput');
      const fileListContainer = document.getElementById('fileListContainer');
      const fileList = document.getElementById('fileList');
      const fileCountSpan = document.getElementById('fileCount');
      const previewContainer = document.getElementById('previewContainer');
      const mergeBtn = document.getElementById('mergeBtn');
      const renderCanvas = document.getElementById('renderCanvas');
      const ctx = renderCanvas.getContext('2d', { alpha: false });
      const statusOverlay = document.getElementById('statusOverlay');
      const statusText = document.getElementById('statusText');
      const progressText = document.getElementById('progressText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const resultContainer = document.getElementById('resultContainer');
      const downloadLink = document.getElementById('downloadLink');

      let selectedFiles = [];
      let isProcessing = false;
      let cancelAnimationId = null;

      // Hidden video element for decoding
      let sourceVideo = document.createElement('video');
      sourceVideo.playsInline = true;
      sourceVideo.crossOrigin = 'anonymous';
      sourceVideo.style.display = 'none';
      document.body.appendChild(sourceVideo);

      // Audio Context setup
      let audioCtx;
      let audioDest;
      let mediaSourceNode;

      // Media Recorder setup
      let mediaRecorder;
      let recordedChunks = [];

      // Resolution for iPhone (Portrait HD)
      const CANVAS_WIDTH = 720;
      const CANVAS_HEIGHT = 1280;

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          selectedFiles = Array.from(e.target.files);
          updateFileListUI();
          previewContainer.classList.remove('hidden');
          resultContainer.classList.add('hidden');

          // Initialize canvas dimensions
          renderCanvas.width = CANVAS_WIDTH;
          renderCanvas.height = CANVAS_HEIGHT;

          // Draw initial black background
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        }
      });

      function updateFileListUI() {
        fileListContainer.classList.remove('hidden');
        fileCountSpan.textContent = selectedFiles.length;
        fileList.innerHTML = '';

        selectedFiles.forEach((file, index) => {
          const li = document.createElement('li');
          li.className =
            'bg-gray-50 rounded-lg p-3 text-sm text-gray-700 flex items-center justify-between border border-gray-100';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'truncate pr-2 w-[80%]';
          nameSpan.textContent = `${index + 1}. ${file.name}`;

          const sizeSpan = document.createElement('span');
          sizeSpan.className = 'text-xs text-gray-400 whitespace-nowrap';
          sizeSpan.textContent = (file.size / (1024 * 1024)).toFixed(1) + ' MB';

          li.appendChild(nameSpan);
          li.appendChild(sizeSpan);
          fileList.appendChild(li);
        });
      }

      function clearFiles() {
        if (isProcessing) return;
        selectedFiles = [];
        fileInput.value = '';
        fileListContainer.classList.add('hidden');
        previewContainer.classList.add('hidden');
        resultContainer.classList.add('hidden');
      }

      function resetApp() {
        clearFiles();
        statusOverlay.classList.remove('opacity-0', 'pointer-events-none');
        statusText.textContent = 'Ready to Merge';
        progressText.classList.add('opacity-0');
        loadingSpinner.classList.remove('animate-spin', 'border-blue-500');
        loadingSpinner.classList.add('hidden');
        mergeBtn.disabled = false;
        mergeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        recordedChunks = [];
      }

      function getSupportedMimeType() {
        const types = [
          'video/mp4',
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/webm',
        ];
        for (let t of types) {
          if (MediaRecorder.isTypeSupported(t)) {
            return t;
          }
        }
        return '';
      }

      mergeBtn.addEventListener('click', async () => {
        if (selectedFiles.length === 0 || isProcessing) return;

        isProcessing = true;
        mergeBtn.disabled = true;
        mergeBtn.classList.add('opacity-50', 'cursor-not-allowed');

        // UI Updates
        statusOverlay.classList.remove('opacity-0', 'pointer-events-none');
        loadingSpinner.classList.remove('hidden');
        loadingSpinner.classList.add('animate-spin', 'border-blue-500');
        statusText.textContent = 'Initializing...';
        progressText.classList.remove('opacity-0');
        progressText.textContent = `0 / ${selectedFiles.length}`;

        try {
          // Initialize Audio Context explicitly on user gesture (required by iOS)
          if (!audioCtx) {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
          }
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          audioDest = audioCtx.createMediaStreamDestination();

          // Setup MediaElementSource only once per video element
          if (!mediaSourceNode) {
            mediaSourceNode = audioCtx.createMediaElementSource(sourceVideo);
            mediaSourceNode.connect(audioDest);
            // Do NOT connect to audioCtx.destination to prevent double audio playback
            // The audio is silently captured into the stream
          }

          startRecording();
        } catch (err) {
          console.error('Error initializing:', err);
          alert(
            'Could not start processing. Ensure your browser supports MediaRecorder.'
          );
          resetApp();
          isProcessing = false;
        }
      });

      function startRecording() {
        // Capture canvas video stream at 30 FPS
        const canvasStream = renderCanvas.captureStream(30);

        // Combine Video and Audio tracks
        const audioTracks = audioDest.stream.getAudioTracks();
        const combinedStream = new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...audioTracks,
        ]);

        const mimeType = getSupportedMimeType();

        mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: mimeType,
          videoBitsPerSecond: 5000000, // 5Mbps for decent quality
        });

        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = finalizeVideo;

        // Start recording
        mediaRecorder.start();

        // Hide overlay to show preview
        statusOverlay.classList.add('opacity-0', 'pointer-events-none');

        // Begin sequence
        playNextVideo(0);
      }

      function playNextVideo(index) {
        if (index >= selectedFiles.length) {
          // All videos finished
          mediaRecorder.stop();
          return;
        }

        statusOverlay.classList.remove('opacity-0', 'pointer-events-none');
        statusText.textContent = 'Processing...';
        progressText.textContent = `${index + 1} / ${selectedFiles.length}`;
        setTimeout(() => {
          statusOverlay.classList.add('opacity-0', 'pointer-events-none');
        }, 800);

        const currentFile = selectedFiles[index];
        const fileURL = URL.createObjectURL(currentFile);

        sourceVideo.src = fileURL;
        sourceVideo.load();

        sourceVideo.onloadedmetadata = () => {
          sourceVideo
            .play()
            .then(() => {
              drawFrame();
            })
            .catch((err) => {
              console.error('Playback failed', err);
              // Skip to next if autoplay fails
              playNextVideo(index + 1);
            });
        };

        sourceVideo.onended = () => {
          cancelAnimationFrame(cancelAnimationId);
          URL.revokeObjectURL(fileURL); // Clean up memory
          playNextVideo(index + 1);
        };
      }

      function drawFrame() {
        if (sourceVideo.paused || sourceVideo.ended) return;

        // Calculate aspect ratio to fit (contain/letterbox)
        const vRatio = CANVAS_WIDTH / sourceVideo.videoWidth;
        const hRatio = CANVAS_HEIGHT / sourceVideo.videoHeight;
        const ratio = Math.min(vRatio, hRatio);

        const drawWidth = sourceVideo.videoWidth * ratio;
        const drawHeight = sourceVideo.videoHeight * ratio;
        const shiftX = (CANVAS_WIDTH - drawWidth) / 2;
        const shiftY = (CANVAS_HEIGHT - drawHeight) / 2;

        // Clear frame
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Draw video frame
        ctx.drawImage(
          sourceVideo,
          0,
          0,
          sourceVideo.videoWidth,
          sourceVideo.videoHeight,
          shiftX,
          shiftY,
          drawWidth,
          drawHeight
        );

        cancelAnimationId = requestAnimationFrame(drawFrame);
      }

      function finalizeVideo() {
        isProcessing = false;

        // Stop all tracks to free up camera/memory
        if (mediaRecorder && mediaRecorder.stream) {
          mediaRecorder.stream.getTracks().forEach((t) => t.stop());
        }

        // Create Blob
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
        const finalURL = URL.createObjectURL(blob);

        // Update UI
        previewContainer.classList.add('hidden');
        resultContainer.classList.remove('hidden');
        fileListContainer.classList.add('hidden');

        // Set download link attributes
        const extension = mediaRecorder.mimeType.includes('mp4')
          ? 'mp4'
          : 'webm';
        downloadLink.href = finalURL;
        downloadLink.download = `merged_video_${Date.now()}.${extension}`;
      }
    </script>
  </body>
</html>
